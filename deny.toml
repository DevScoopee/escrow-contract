# cargo-deny configuration (run in CI by the `dependencies` job).
# The contract custodies funds, so a known-vulnerable, yanked or
# unexpectedly-licensed dependency must fail CI.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the dependency graph exactly as it is built for the contract.
all-features = false

[advisories]
# Any RUSTSEC advisory (vulnerability, unsound, unmaintained notice) fails CI.
version = 2
yanked = "deny"
# To accept a specific advisory, add it here with a reason and a link.
ignore = [
  # paste is unmaintained (informational, not a vulnerability). It is a
  # build-time proc-macro pulled in by soroban-sdk -> soroban-env-host ->
  # ark-bls12-381 -> ark-ff and cannot be replaced from this repository.
  # Re-check when upgrading soroban-sdk.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, transitive via soroban-sdk" },
  # crypto-bigint 0.5.5 has constant-time issues fixed only in 0.7.6. It is
  # pulled in by soroban-env-host -> k256/p256 -> elliptic-curve 0.13, the
  # host side used by tests, not compiled into the contract wasm, and the
  # semver-incompatible fix cannot be selected from this repository.
  # Re-check when upgrading soroban-sdk.
  { id = "RUSTSEC-2026-0387", reason = "test-host-only transitive dep via soroban-env-host; fix needs crypto-bigint 0.7" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# The contract crate itself is `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
