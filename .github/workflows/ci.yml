name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bindings-network:
        description: Network used to derive the contract id baked into the TypeScript bindings
        type: choice
        default: testnet
        options:
          - testnet
          - futurenet
          - public

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned to match rust-toolchain.toml. stellar-cli rejects 1.81, 1.82,
        # 1.83 and 1.91.0 outright, so this cannot float on @stable.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Install stellar-cli
        # soroban-sdk 28 refuses to build under a bare `cargo build` and
        # requires stellar-cli v25.2.0+. The action installs a prebuilt binary;
        # the version comes from the ref, so bump the tag to change it.
        uses: stellar/stellar-cli@v28.0.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check for orphaned test snapshots
        run: python3 scripts/check-orphan-snapshots.py

      - name: Check for orphaned test modules
        run: python3 scripts/check-orphan-test-modules.py

      - name: Format check
        # TEMP DIAGNOSTIC: run fmt/clippy/tests, stream base64 logs via 10 annotation slots.
        run: |
          set +e
          cargo fmt --manifest-path contracts/milestone-escrow/Cargo.toml --check > /tmp/fmt.log 2>&1
          rc=$?
          cargo clippy --manifest-path contracts/milestone-escrow/Cargo.toml --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          crc=$?
          if [ $rc -eq 0 ] && [ $crc -eq 0 ]; then
            cargo test --manifest-path contracts/milestone-escrow/Cargo.toml > /tmp/test.log 2>&1
            crt=$?
            sed -e 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E 'FAILED|panicked|test result|^error|^failures|^ *-->' -A 6 | tail -c 8000 > /tmp/test.clean
          else
            crt=0
          fi
          for x in fmt clippy test; do
            [ -f /tmp/$x.log ] || : > /tmp/$x.log
            [ -f /tmp/$x.clean ] || sed -e 's/\x1b\[[0-9;]*m//g' /tmp/$x.log > /tmp/$x.clean
            python3 -c "import base64; open('/tmp/$x.b64','w').write(base64.b64encode(open('/tmp/$x.clean','rb').read()).decode())"
          done
          rm -f /tmp/want.txt
          if [ $rc -ne 0 ]; then echo fmt >> /tmp/want.txt; fi
          if [ $crc -ne 0 ]; then echo clippy >> /tmp/want.txt; fi
          if [ $crt -ne 0 ]; then echo test >> /tmp/want.txt; fi
          if [ ! -s /tmp/want.txt ]; then echo "::error::SUMM| fmt=0 clippy=0 test=0"; exit 0; fi
          echo "::error::SUMM| rc=$rc crc=$crc crt=$crt b $(wc -c < /tmp/fmt.clean) c $(wc -c < /tmp/clippy.clean) t $(wc -c < /tmp/test.clean)"
          python3 - <<'PYEOF'
          import base64
          want = [w.strip() for w in open('/tmp/want.txt') if w.strip()]
          room = 9
          emitted = 0
          for p, name in enumerate(want):
              if room <= 0:
                  break
              data = base64.b64encode(open(f'/tmp/{name}.clean', 'rb').read()).decode()
              chunks = [data[i:i+950] for i in range(0, len(data), 950)]
              for k, c in enumerate(chunks[:room]):
                  print(f'::error::P{p}-{k} {c}')
                  emitted += 1
              room -= len(chunks[:room])
          if emitted == 0:
              print('::error::NOPAYLOAD| none')
          PYEOF
          exit 1

      - name: Clippy
        run: cargo clippy --manifest-path contracts/milestone-escrow/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path contracts/milestone-escrow/Cargo.toml

      - name: Build WASM
        run: stellar contract build --manifest-path contracts/milestone-escrow/Cargo.toml

  typescript-bindings:
    # Issue #744: clients hand-encode ScVals today (backend build-tx mapper,
    # frontend initialize call) and their decoding of get_job /
    # get_whitelisted_tokens is broken precisely because nothing pins the
    # contract's types. Generate TypeScript bindings from the built wasm for
    # every main build and publish them as a versioned GitHub Package on
    # release, so client repos can switch to a typed client instead of
    # spelling out { type: "u64", value } by hand.
    # The contract id baked into the bindings is the checksum deploy-time
    # address of the built wasm on the chosen network; consumers override it
    # when instantiating the client (see docs/typescript-bindings.md).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned to match rust-toolchain.toml; see the note in the test job.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none

      - name: Install stellar-cli
        uses: stellar/stellar-cli@v28.0.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM
        run: stellar contract build --manifest-path contracts/milestone-escrow/Cargo.toml

      - name: Generate TypeScript bindings
        run: |
          set -euo pipefail
          WASM=target/wasm32v1-none/release/milestone_escrow.wasm
          CONTRACT_ID=$(stellar contract id checksummed \
            --wasm "$WASM" --network "${BINDINGS_NETWORK:-testnet}" | tail -n 1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-main.${GITHUB_RUN_NUMBER}"
          fi
          stellar contract bindings typescript \
            --wasm "$WASM" \
            --output-dir bindings/ts \
            --contract-id "$CONTRACT_ID" \
            --package-name "@goldii-locks/milestone-escrow-bindings" \
            --version "$VERSION"
          {
            echo "### TypeScript bindings"
            echo
            echo "- contract id baked into bindings: \`$CONTRACT_ID\`"
            echo "- package version: \`$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BINDINGS_NETWORK: ${{ inputs.bindings-network }}

      - name: Upload bindings
        uses: actions/upload-artifact@v4
        with:
          name: milestone-escrow-bindings-ts-${{ github.sha }}
          path: bindings/ts/

  publish-bindings:
    # On a v* tag, publish the bindings built above as a versioned package in
    # GitHub Packages so client repos can depend on it (issue #744).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: typescript-bindings
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: milestone-escrow-bindings-ts-${{ github.sha }}
          path: bindings/ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@goldii-locks'

      - name: Publish
        working-directory: bindings/ts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproducible-wasm:
    # Builds the release wasm in the pinned container (issue #773) and publishes
    # it with its SHA-256 for every commit, so a deployed contract's wasm hash
    # can be traced back to the commit that produced it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproducible build
        run: bash scripts/build-reproducible.sh "$GITHUB_SHA"

      - name: Publish hash
        run: |
          {
            echo "### milestone_escrow.wasm"
            echo
            echo "| commit | sha256 |"
            echo "|---|---|"
            echo "| \`$GITHUB_SHA\` | \`$(cut -d' ' -f1 dist/milestone_escrow.wasm.sha256)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat dist/build-info.json

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: milestone_escrow-wasm-${{ github.sha }}
          path: dist/
